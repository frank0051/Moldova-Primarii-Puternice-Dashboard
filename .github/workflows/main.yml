name: Deploy Website

on:
  push:
    branches: ["main"] # Change to master if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Replace placeholder with secret
      - name: Inject CARTO API Key
        env:
          CARTO_KEY: ${{ secrets.carto_key }}
        run: |
          sed -i "s|__CARTO_API_KEY__|${CARTO_KEY}|g" decision-tracker.html
          sed -i "s|__CARTO_API_KEY__|${CARTO_KEY}|g" new-level1-map.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
